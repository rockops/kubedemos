apiVersion: v1
kind: Pod
metadata:
  name: multi-init-web
  labels:
    app: multi-init-web
spec:
  volumes:
    - name: shared-data
      emptyDir: {}
  initContainers:
    - name: step1-system-info
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          echo "==> Step 1: Gathering system metadata..."
          mkdir -p /work-dir
          echo "Kernel: $(uname -s -r)" > /work-dir/info.txt
          echo "Node Hostname: $(hostname)" >> /work-dir/info.txt
          echo "Init Timestamp: $(date -u)" >> /work-dir/info.txt
          sleep 5
          echo "==> Step 1 complete."
      volumeMounts:
        - name: shared-data
          mountPath: /work-dir

    - name: step2-build-page
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          echo "==> Step 2: Generating HTML landing page from gathered metadata..."
          cat <<EOF > /work-dir/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <title>Init Containers Demo</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
              .card { background: #1e293b; border-radius: 8px; padding: 24px; max-width: 600px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #334155; }
              h1 { color: #38bdf8; margin-top: 0; }
              pre { background: #090d16; padding: 12px; border-radius: 4px; color: #a5f3fc; border: 1px solid #1e293b; }
              .tag { display: inline-block; background: #0284c7; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
            </style>
          </head>
          <body>
            <div class="card">
              <span class="tag">KUBERNETES INIT CONTAINERS</span>
              <h1>Page Successfully Generated!</h1>
              <p>This HTML content was generated by <strong>init containers</strong> before Nginx even started.</p>
              <h3>Metadata collected by Init Container:</h3>
              <pre>$(cat /work-dir/info.txt)</pre>
            </div>
          </body>
          </html>
          EOF
          sleep 5
          echo "==> Step 2 complete."
      volumeMounts:
        - name: shared-data
          mountPath: /work-dir

  containers:
    - name: web-server
      image: nginx:alpine
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html

