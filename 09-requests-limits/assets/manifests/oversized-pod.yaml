apiVersion: v1
kind: Pod
metadata:
  name: oversized-pod
  labels:
    app: oversized-pod
spec:
  containers:
    - name: web-app
      image: nginx:alpine
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: 500Gi
          cpu: 128
        limits:
          memory: 500Gi
          cpu: 128

