apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  labels:
    app: webapp
  annotations:
    kubernetes.io/change-cause: "Release v3.0.0: Broken image tag release"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
        version: v3
    spec:
      containers:
      - name: web
        image: nginx:broken-v3-tag-error
        ports:
        - containerPort: 80
        env:
        - name: APP_VERSION
          value: "v3.0.0"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - 'echo "[App $APP_VERSION] Response from Pod: $POD_NAME ($POD_IP)" > /usr/share/nginx/html/index.html'
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 2

