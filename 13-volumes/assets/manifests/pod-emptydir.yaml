apiVersion: v1
kind: Pod
metadata:
  name: shared-emptydir
  labels:
    app: shared-emptydir
spec:
  volumes:
    - name: cache-volume
      emptyDir: {}
  containers:
    - name: writer
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          echo "Writer container starting..."
          echo "Session started at $(date -u)" > /shared/data.txt
          count=1
          while true; do
            echo "Message $count logged at $(date -u)" >> /shared/data.txt
            count=$((count + 1))
            sleep 2
          done
      volumeMounts:
        - name: cache-volume
          mountPath: /shared

    - name: reader
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          echo "Reader container starting..."
          while true; do
            if [ -f /shared/data.txt ]; then
              echo "--- Latest content from /shared/data.txt ---"
              tail -n 3 /shared/data.txt
            fi
            sleep 5
          done
      volumeMounts:
        - name: cache-volume
          mountPath: /shared

