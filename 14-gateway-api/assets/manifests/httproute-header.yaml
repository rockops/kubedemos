apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-routes
  namespace: default
spec:
  parentRefs:
  - name: my-gateway
  rules:
  # Rule 1: Header match 'X-Version: canary' routes 100% to store-v2 with custom response header
  - matches:
    - path:
        type: PathPrefix
        value: /store
      headers:
      - name: X-Version
        value: canary
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        add:
        - name: X-Route-Matched
          value: canary-tester
    backendRefs:
    - name: store-v2
      port: 80
  # Rule 2: Default traffic to /store with weight split
  - matches:
    - path:
        type: PathPrefix
        value: /store
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        add:
        - name: X-Route-Matched
          value: weighted-pool
    backendRefs:
    - name: store-v1
      port: 80
      weight: 80
    - name: store-v2
      port: 80
      weight: 20
  # Rule 3: Blog traffic
  - matches:
    - path:
        type: PathPrefix
        value: /blog
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /
    backendRefs:
    - name: blog-v1
      port: 80

