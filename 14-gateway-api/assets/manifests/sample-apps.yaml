apiVersion: v1
kind: ConfigMap
metadata:
  name: store-v1-html
  namespace: default
data:
  index.html: "Store Service v1 (Production)\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-v1
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store
      version: v1
  template:
    metadata:
      labels:
        app: store
        version: v1
    spec:
      containers:
      - name: web
        image: nginx:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: store-v1-html
---
apiVersion: v1
kind: Service
metadata:
  name: store-v1
  namespace: default
spec:
  selector:
    app: store
    version: v1
  ports:
  - port: 80
    targetPort: 80
---
