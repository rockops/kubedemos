apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-sa
  namespace: public
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: public-reader
  namespace: public
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: public-reader-binding
  namespace: public
subjects:
- kind: User
  name: public-sa
roleRef:
  kind: Role
  name: public-reader
  apiGroup: rbac.authorization.k8s.io
