apiVersion: v1
kind: ConfigMap
metadata:
  name: http-server-script
data:
  server.py: |
    import http.server
    import json
    import os

    class StatusHandler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            ready = os.path.exists('/tmp/ready')
            healthy = os.path.exists('/tmp/health')

            if self.path == '/ready':
                if ready:
                    self.send_response(200)
                    self.send_header('Content-Type', 'text/plain')
                    self.end_headers()
                    self.wfile.write(b"OK - Ready\n")
                else:
                    self.send_response(500)
                    self.send_header('Content-Type', 'text/plain')
                    self.end_headers()
                    self.wfile.write(b"Error - Not Ready\n")
            elif self.path == '/health':
                if healthy:
                    self.send_response(200)
                    self.send_header('Content-Type', 'text/plain')
                    self.end_headers()
                    self.wfile.write(b"OK - Healthy\n")
                else:
                    self.send_response(500)
                    self.send_header('Content-Type', 'text/plain')
                    self.end_headers()
                    self.wfile.write(b"Error - Unhealthy\n")
            elif self.path == '/':
                self.send_response(200)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                data = {
                    "status": "Ready" if ready else "Not Ready",
                    "ready": ready,
                    "healthy": healthy
                }
                self.wfile.write((json.dumps(data, indent=2) + "\n").encode('utf-8'))
            else:
                self.send_response(404)
                self.end_headers()
                self.wfile.write(b"Not Found\n")

        def log_message(self, format, *args):
            print(f"{self.address_string()} - {format % args}", flush=True)

    if __name__ == '__main__':
        # Initialize /tmp/health so the container starts healthy
        open('/tmp/health', 'w').close()
        server = http.server.HTTPServer(('0.0.0.0', 8080), StatusHandler)
        print("Server running on port 8080...", flush=True)
        server.serve_forever()
---
apiVersion: v1
kind: Pod
metadata:
  name: http-probe-pod
  labels:
    app: http-probe
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: server
    image: python:alpine
    imagePullPolicy: IfNotPresent
    command: ["python3", "/app/server.py"]
    ports:
    - containerPort: 8080
      name: http
    readinessProbe:
      httpGet:
        path: /ready
        port: 8080
      initialDelaySeconds: 2
      periodSeconds: 2
      failureThreshold: 2
    livenessProbe:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 2
      periodSeconds: 2
      failureThreshold: 2
    volumeMounts:
    - name: script-vol
      mountPath: /app
  volumes:
  - name: script-vol
    configMap:
      name: http-server-script
