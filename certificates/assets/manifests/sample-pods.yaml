apiVersion: v1
kind: Pod
metadata:
  name: public-pod
  namespace: public
  labels:
    app: public-demo
spec:
  containers:
  - name: nginx
    image: nginx:alpine
---
apiVersion: v1
kind: Pod
metadata:
  name: private-pod
  namespace: private
  labels:
    app: private-demo
spec:
  containers:
  - name: nginx
    image: nginx:alpine
