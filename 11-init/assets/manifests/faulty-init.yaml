apiVersion: v1
kind: Pod
metadata:
  name: faulty-pod
  labels:
    app: faulty-pod
spec:
  initContainers:
    - name: pre-flight-check
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          echo "Running pre-flight validation checks..."
          sleep 2
          echo "ERROR: Critical database migration script missing or corrupt!" >&2
          exit 1
  containers:
    - name: critical-service
      image: nginx:alpine
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80

