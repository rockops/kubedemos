apiVersion: v1
kind: Pod
metadata:
  name: db-backend
  labels:
    app: db-backend
spec:
  containers:
    - name: mock-db
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          echo "Mock DB listening on port 3306..."
          nc -lk -p 3306 -e echo "DB_READY"
      ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  selector:
    app: db-backend
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306

