apiVersion: v1
kind: Pod
metadata:
  name: pod-dynamic
  labels:
    app: pod-dynamic
spec:
  volumes:
    - name: dynamic-storage
      persistentVolumeClaim:
        claimName: dynamic-pvc
  containers:
    - name: web
      image: nginx:alpine
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
      volumeMounts:
        - name: dynamic-storage
          mountPath: /usr/share/nginx/html

