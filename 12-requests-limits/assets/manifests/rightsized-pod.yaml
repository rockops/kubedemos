apiVersion: v1
kind: Pod
metadata:
  name: rightsized-pod
  labels:
    app: rightsized-pod
spec:
  containers:
    - name: web-app
      image: nginx:alpine
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: 64Mi
          cpu: 100m
        limits:
          memory: 128Mi
          cpu: 200m

