apiVersion: v1
kind: Pod
metadata:
  name: memory-fixed
  labels:
    app: memory-fixed
spec:
  containers:
    - name: mem-consumer
      image: python:alpine
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: 100Mi
          cpu: 100m
        limits:
          memory: 300Mi
          cpu: 200m
      command:
        - python3
        - -u
        - -c
        - |
          import time, sys
          print("Starting memory consumer container with adequate limits...", flush=True)
          print("Container limit is set to: 300Mi", flush=True)
          data = []
          for chunk in range(1, 8):
              print(f"Allocating chunk {chunk} (total: {chunk * 20}MB)...", flush=True)
              data.append(b"X" * (20 * 1024 * 1024))
              time.sleep(1)
          print("SUCCESS: All 140MB allocated smoothly without triggering OOM!", flush=True)
          print("Holding memory and keeping container alive...", flush=True)
          while True:
              time.sleep(60)

